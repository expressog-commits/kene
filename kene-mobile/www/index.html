<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kéné — Connexion en cours</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f7f6f2;
        color: #0b1f1d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 18px 40px -24px rgba(11, 31, 29, 0.35);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #0b1f1d;
        color: #0b7e72;
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
      }
      p {
        margin: 0 0 20px;
        font-size: 13px;
        line-height: 1.55;
        color: #475569;
      }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        background: #0b7e72;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      .samu {
        margin-top: 14px;
        font-size: 12px;
        color: #64748b;
      }
      .samu a {
        color: #0b7e72;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">K</div>
      <h1>Kéné</h1>
      <p>
        Connexion au service en cours ou connexion internet indisponible. Vérifiez
        votre réseau mobile puis réessayez.
      </p>
      <a class="btn" href="https://kene-web-production.up.railway.app/app">
        Réessayer
      </a>
      <p class="samu">
        Urgence vitale en Côte d'Ivoire : <a href="tel:185">Appeler le SAMU 185</a>
      </p>
    </main>
  </body>
</html>
