<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#045D56" />
    <title>Kéné — Hors connexion</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 20px;
        background: #ffffff;
        color: #0b1f1d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .shell {
        width: 100%;
        max-width: 360px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 32px 24px 26px;
        text-align: center;
        box-shadow: 0 20px 44px -26px rgba(4, 93, 86, 0.25);
      }
      .emblem {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 76px;
        height: 76px;
        border-radius: 22px;
        background: #e9f7f4;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 21px;
        line-height: 1.25;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #0b1f1d;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.55;
        color: #475569;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 52px;
        height: 52px;
        padding: 0 18px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.12s ease, opacity 0.12s ease;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-retry {
        background: #045d56;
        color: #ffffff;
        box-shadow: 0 10px 22px -12px rgba(4, 93, 86, 0.65);
      }
      .btn-samu {
        background: #e11d48;
        color: #ffffff;
        box-shadow: 0 10px 22px -12px rgba(225, 29, 72, 0.55);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="emblem" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="56" height="56" fill="none">
          <rect width="32" height="32" rx="9" fill="#045D56" />
          <g transform="rotate(-45 16 16)">
            <rect x="8" y="12.8" width="16" height="6.4" rx="3.2" fill="#0B1F1D" />
            <rect x="16" y="12.8" width="8" height="6.4" rx="3.2" fill="#F7F6F2" />
          </g>
        </svg>
      </div>
      <h1>Pas de connexion internet</h1>
      <p>
        Vérifiez votre réseau mobile ou Wi-Fi puis réessayez d’ouvrir Kéné.
      </p>
      <div class="actions">
        <a class="btn btn-retry" href="https://kene-web-production.up.railway.app/">
          Réessayer
        </a>
        <a class="btn btn-samu" href="tel:185">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M7 3.5h3l1.5 4-2 1.5c.8 2.2 2.3 3.8 4.5 4.6l1.5-2 4 1.5v3c0 1.2-1 2.2-2.2 2.1C10.6 17.9 6.1 13.4 4.9 5.7 4.8 4.5 5.8 3.5 7 3.5z" />
          </svg>
          Urgence · Appeler le SAMU 185
        </a>
      </div>
    </main>
  </body>
</html>
