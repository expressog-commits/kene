name: Build Kene Android APK

on:
  push:
    branches:
      - main
    paths:
      - "kene-mobile/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kene-mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies and sync Capacitor
        run: |
          npm install --no-audit --no-fund
          npx cap sync android

      - name: Build Debug APK
        working-directory: kene-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk kene-android.apk

      - name: Upload kene-android.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: kene-android-apk
          path: kene-mobile/android/kene-android.apk
          retention-days: 30
